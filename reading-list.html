<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading List — Ian Kim</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f9f8f1;
            font-family: 'Crimson Pro', serif;
            color: #2a2a2a;
            line-height: 1.65;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px;
        }

        #main-container { width: 100%; max-width: 700px; }

        header.profile { margin-bottom: 3rem; }
        header.profile h1 { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 0.2rem; }
        header.profile p { font-size: 1.1rem; color: #666; font-style: italic; }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            font-size: 1rem;
            color: #8b2222;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #550000; }
        .back-link::before { content: '← '; }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e0ded4;
        }

        .book-section {
            margin-bottom: 3rem;
        }

        .book-entry {
            margin-bottom: 1.8rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid #ebe9e0;
        }

        .book-entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .book-title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.2rem;
            color: #2a2a2a;
        }

        .book-author {
            font-size: 1rem;
            color: #666;
            font-style: italic;
            margin-bottom: 0.8rem;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-wrapper {
            flex: 1;
            height: 8px;
            background-color: #e8e6dc;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: #8b2222;
            border-radius: 4px;
            transition: width 0.6s ease-out;
        }

        .progress-bar.completed {
            background-color: #4a7c59;
        }

        .progress-text {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #888;
            min-width: 45px;
            text-align: right;
        }

        .status-badge {
            display: inline-block;
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 4px;
            margin-top: 0.6rem;
        }

        .status-reading {
            color: #8b2222;
            background-color: rgba(139, 34, 34, 0.08);
        }

        .status-completed {
            color: #4a7c59;
            background-color: rgba(74, 124, 89, 0.1);
        }

        .status-want-to-read {
            color: #666;
            background-color: rgba(100, 100, 100, 0.08);
        }

        #loading {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 2rem 0;
        }

        .stats-row {
            display: flex;
            gap: 2rem;
            margin-bottom: 2.5rem;
            padding: 1.2rem;
            background-color: #f0efe6;
            border-radius: 6px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 600;
            color: #2a2a2a;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.3rem;
        }

        @media (max-width: 600px) {
            body { padding-top: 40px; font-size: 18px; }
            .stats-row { flex-wrap: wrap; gap: 1rem; }
            .stat-item { flex: 1; min-width: 80px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-entry {
            animation: fadeIn 0.4s ease-in-out;
            animation-fill-mode: backwards;
        }

        .book-section:nth-child(1) .book-entry:nth-child(1) { animation-delay: 0.05s; }
        .book-section:nth-child(1) .book-entry:nth-child(2) { animation-delay: 0.1s; }
        .book-section:nth-child(1) .book-entry:nth-child(3) { animation-delay: 0.15s; }
        .book-section:nth-child(1) .book-entry:nth-child(4) { animation-delay: 0.2s; }
        .book-section:nth-child(1) .book-entry:nth-child(5) { animation-delay: 0.25s; }
    </style>
</head>
<body>

    <div id="main-container">
        <a href="index.html" class="back-link">Back to blog</a>

        <header class="profile">
            <h1>Reading List</h1>
            <p>Books I'm reading, have read, and want to read.</p>
        </header>

        <div id="loading">Loading books...</div>

        <div id="stats-container"></div>
        <div id="reading-section"></div>
        <div id="completed-section"></div>
        <div id="want-to-read-section"></div>
    </div>

    <script>
        const USERNAME = 'iankmm';
        const REPO = 'blogentry';
        const BOOKS_FILE = 'books.md';

        async function initReadingList() {
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${BOOKS_FILE}`);
                if (!response.ok) throw new Error('Failed to load books file');
                
                const fileData = await response.json();
                // Properly decode UTF-8 from base64 (handles Korean, etc.)
                const bytes = Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0));
                const content = new TextDecoder('utf-8').decode(bytes);
                
                const books = parseBooks(content);
                
                loading.style.display = 'none';
                
                renderStats(books);
                renderBooks(books);

            } catch (error) {
                console.error(error);
                loading.innerText = "Error loading reading list.";
            }
        }

        function parseBooks(rawText) {
            const entries = rawText.split('---').filter(entry => entry.trim());
            const books = [];

            entries.forEach(entry => {
                const lines = entry.split('\n');
                const book = {
                    title: '',
                    author: '',
                    progress: 0,
                    status: 'want-to-read'
                };

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('Title:')) {
                        book.title = trimmed.replace('Title:', '').trim();
                    } else if (trimmed.startsWith('Author:')) {
                        book.author = trimmed.replace('Author:', '').trim();
                    } else if (trimmed.startsWith('Progress:')) {
                        book.progress = parseInt(trimmed.replace('Progress:', '').trim()) || 0;
                    } else if (trimmed.startsWith('Status:')) {
                        book.status = trimmed.replace('Status:', '').trim();
                    }
                });

                if (book.title) {
                    books.push(book);
                }
            });

            return books;
        }

        function renderStats(books) {
            const container = document.getElementById('stats-container');
            
            const reading = books.filter(b => b.status === 'reading').length;
            const completed = books.filter(b => b.status === 'completed').length;
            const wantToRead = books.filter(b => b.status === 'want-to-read').length;

            container.innerHTML = `
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-number">${reading}</div>
                        <div class="stat-label">Reading</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${completed}</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${wantToRead}</div>
                        <div class="stat-label">Want to Read</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${books.length}</div>
                        <div class="stat-label">Total</div>
                    </div>
                </div>
            `;
        }

        function renderBooks(books) {
            const readingBooks = books.filter(b => b.status === 'reading');
            const completedBooks = books.filter(b => b.status === 'completed');
            const wantToReadBooks = books.filter(b => b.status === 'want-to-read');

            if (readingBooks.length > 0) {
                renderSection('reading-section', 'Currently Reading', readingBooks);
            }

            if (completedBooks.length > 0) {
                renderSection('completed-section', 'Completed', completedBooks);
            }

            if (wantToReadBooks.length > 0) {
                renderSection('want-to-read-section', 'Want to Read', wantToReadBooks);
            }
        }

        function renderSection(containerId, title, books) {
            const container = document.getElementById(containerId);
            
            let html = `
                <div class="book-section">
                    <h2 class="section-title">${title}</h2>
            `;

            books.forEach(book => {
                const progressClass = book.progress === 100 ? 'completed' : '';
                const statusClass = `status-${book.status}`;
                const statusText = book.status.replace(/-/g, ' ');

                html += `
                    <div class="book-entry">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">by ${book.author}</p>
                        <div class="progress-container">
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar ${progressClass}" style="width: ${book.progress}%"></div>
                            </div>
                            <span class="progress-text">${book.progress}%</span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        initReadingList();
    </script>
</body>
</html>
