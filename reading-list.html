<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading List — Ian Kim</title>
    <meta name="description" content="Books Ian Kim is reading, has read, and wants to read.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #FDFBF7;
            --bg-secondary: #F5F3EE;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #9a9a94;
            --accent: #8b2222;
            --accent-muted: rgba(139, 34, 34, 0.07);
            --green: #4a7c59;
            --green-muted: rgba(74, 124, 89, 0.08);
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.10);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 15px;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        #main-container {
            width: 100%;
            max-width: 920px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: 40px;
            padding-bottom: 24px;
        }

        /* ——— Top bar: back + header inline ——— */
        .top-bar {
            display: flex;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(12px);
            animation: slideUp 0.7s var(--ease-out-expo) 0.05s forwards;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            text-decoration: none;
            transition: color 0.3s var(--ease-out-expo);
            flex-shrink: 0;
        }

        .back-link .back-arrow {
            transition: transform 0.3s var(--ease-spring);
            font-family: 'Newsreader', serif;
            font-size: 0.9rem;
        }

        .back-link:hover { color: var(--accent); }
        .back-link:hover .back-arrow { transform: translateX(-3px); }

        .top-bar h1 {
            font-family: 'Newsreader', serif;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        /* ——— Stats: compact inline row ——— */
        .stats-row {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.2rem;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(10px);
            animation: slideUp 0.6s var(--ease-out-expo) 0.15s forwards;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .stat-number {
            font-family: 'Newsreader', serif;
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ——— Loading ——— */
        #loading {
            text-align: left;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1rem 0;
        }

        .loading-shimmer {
            display: block;
            height: 1px;
            width: 50px;
            margin-top: 0.5rem;
            background: linear-gradient(90deg, transparent, var(--text-tertiary), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ——— Books grid: all sections side by side ——— */
        #books-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0 2.5rem;
            min-height: 0;
            overflow: hidden;
        }

        .book-column {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .book-column::-webkit-scrollbar {
            display: none;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-tertiary);
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border-strong);
            margin-bottom: 0.2rem;
            flex-shrink: 0;
        }

        /* ——— Book entries: compact ——— */
        .book-entry {
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--border);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.4s var(--ease-out-expo), transform 0.4s var(--ease-out-expo);
        }

        .book-entry.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .book-entry:last-child {
            border-bottom: none;
        }

        .book-title {
            font-family: 'Newsreader', serif;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.25;
            margin-bottom: 0.05rem;
            color: var(--text-primary);
        }

        .book-author {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        /* ——— Progress bar ——— */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar-wrapper {
            flex: 1;
            height: 2px;
            background-color: var(--border-strong);
            border-radius: 1px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent);
            border-radius: 1px;
            transition: width 0.8s var(--ease-spring);
        }

        .progress-bar.completed {
            background-color: var(--green);
        }

        .progress-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-tertiary);
            min-width: 28px;
            text-align: right;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
        }

        /* ——— Focus & accessibility ——— */
        .back-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .skip-link {
            position: absolute;
            top: -100%;
            left: 16px;
            background: var(--text-primary);
            color: var(--bg);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 100;
            text-decoration: none;
            transition: top 0.2s;
        }

        .skip-link:focus { top: 16px; }

        /* ——— Responsive: stack on mobile ——— */
        @media (max-width: 700px) {
            html, body {
                overflow: auto;
            }

            body {
                padding: 0 16px;
                font-size: 14px;
            }

            #main-container {
                height: auto;
                padding-top: 32px;
                padding-bottom: 32px;
            }

            .top-bar h1 {
                font-size: 1.6rem;
            }

            .stats-row {
                gap: 1.2rem;
                flex-wrap: wrap;
            }

            #books-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem 0;
                overflow: visible;
            }

            .book-column {
                overflow: visible;
            }
        }

        /* ——— Animations ——— */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <a href="#books-grid" class="skip-link">Skip to content</a>

    <div id="main-container">
        <div class="top-bar">
            <a href="index.html" class="back-link">
                <span class="back-arrow">&larr;</span>
                <span>Back</span>
            </a>
            <h1>Reading List</h1>
        </div>

        <div id="stats-container"></div>

        <div id="loading">
            Loading
            <span class="loading-shimmer"></span>
        </div>

        <div id="books-grid">
            <div id="reading-section" class="book-column"></div>
            <div id="completed-section" class="book-column"></div>
            <div id="want-to-read-section" class="book-column"></div>
        </div>
    </div>

    <script>
        const USERNAME = 'iankmm';
        const REPO = 'blogentry';
        const BOOKS_FILE = 'books.md';

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const delay = parseInt(el.dataset.index || 0) * 50;
                    setTimeout(() => el.classList.add('visible'), delay);
                    revealObserver.unobserve(el);
                }
            });
        }, { threshold: 0.05 });

        async function initReadingList() {
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${BOOKS_FILE}`);
                if (!response.ok) throw new Error('Failed to load books file');

                const fileData = await response.json();
                const bytes = Uint8Array.from(atob(fileData.content), c => c.charCodeAt(0));
                const content = new TextDecoder('utf-8').decode(bytes);

                const books = parseBooks(content);

                loading.style.display = 'none';

                renderStats(books);
                renderBooks(books);

            } catch (error) {
                console.error(error);
                loading.innerHTML = '<span style="color: var(--accent);">Connection failed. Please try again.</span>';
            }
        }

        function parseBooks(rawText) {
            const entries = rawText.split('---').filter(entry => entry.trim());
            const books = [];

            entries.forEach(entry => {
                const lines = entry.split('\n');
                const book = {
                    title: '',
                    author: '',
                    progress: 0,
                    status: 'want-to-read'
                };

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('Title:')) {
                        book.title = trimmed.replace('Title:', '').trim();
                    } else if (trimmed.startsWith('Author:')) {
                        book.author = trimmed.replace('Author:', '').trim();
                    } else if (trimmed.startsWith('Progress:')) {
                        book.progress = parseInt(trimmed.replace('Progress:', '').trim()) || 0;
                    } else if (trimmed.startsWith('Status:')) {
                        book.status = trimmed.replace('Status:', '').trim();
                    }
                });

                if (book.title) {
                    books.push(book);
                }
            });

            return books;
        }

        function renderStats(books) {
            const container = document.getElementById('stats-container');

            const reading = books.filter(b => b.status === 'reading').length;
            const completed = books.filter(b => b.status === 'completed').length;
            const wantToRead = books.filter(b => b.status === 'want-to-read').length;

            container.innerHTML = `
                <div class="stats-row">
                    <div class="stat-item">
                        <span class="stat-number">${reading}</span>
                        <span class="stat-label">Reading</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${completed}</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${wantToRead}</span>
                        <span class="stat-label">Want to read</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">${books.length}</span>
                        <span class="stat-label">Total</span>
                    </div>
                </div>
            `;
        }

        function renderBooks(books) {
            const readingBooks = books.filter(b => b.status === 'reading');
            const completedBooks = books.filter(b => b.status === 'completed');
            const wantToReadBooks = books.filter(b => b.status === 'want-to-read');

            renderColumn('reading-section', 'Currently reading', readingBooks);
            renderColumn('completed-section', 'Completed', completedBooks);
            renderColumn('want-to-read-section', 'Want to read', wantToReadBooks);
        }

        function renderColumn(containerId, title, books) {
            const container = document.getElementById(containerId);

            if (books.length === 0) {
                container.style.display = 'none';
                return;
            }

            let html = `<h2 class="section-title">${title}</h2>`;

            books.forEach((book, i) => {
                const progressClass = book.progress === 100 ? 'completed' : '';

                html += `
                    <div class="book-entry" data-index="${i}">
                        <h3 class="book-title">${book.title}</h3>
                        <p class="book-author">by ${book.author}</p>
                        <div class="progress-container">
                            <div class="progress-bar-wrapper">
                                <div class="progress-bar ${progressClass}" style="width: ${book.progress}%"></div>
                            </div>
                            <span class="progress-text">${book.progress}%</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            container.querySelectorAll('.book-entry').forEach(el => {
                revealObserver.observe(el);
            });
        }

        initReadingList();
    </script>
</body>
</html>
