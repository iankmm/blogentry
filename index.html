<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ian Kim</title>
    <meta name="description" content="Ian Kim — infra/security at Exa, cs/math at UT. Writing about systems, security, and mathematics.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' },
            startup: { pageReady: () => MathJax.startup.defaultPageReady() }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        :root {
            --bg: #FDFBF7;
            --bg-secondary: #F5F3EE;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #9a9a94;
            --accent: #8b2222;
            --accent-muted: rgba(139, 34, 34, 0.07);
            --border: rgba(0, 0, 0, 0.06);
            --border-strong: rgba(0, 0, 0, 0.10);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            line-height: 1.55;
            font-size: 15px;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        #main-container {
            width: 100%;
            max-width: 680px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding-top: 40px;
            padding-bottom: 20px;
        }

        /* ——— Header: compact ——— */
        header.profile {
            flex-shrink: 0;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(14px);
            animation: slideUp 0.7s var(--ease-out-expo) 0.05s forwards;
        }

        header.profile h1 {
            font-family: 'Newsreader', serif;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: -0.03em;
            line-height: 1.1;
            color: var(--text-primary);
        }

        header.profile .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .header-links {
            display: flex;
            gap: 1.2rem;
            margin-left: auto;
        }

        .header-links a {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            text-decoration: none;
            padding: 4px 0;
            position: relative;
            transition: color 0.3s var(--ease-out-expo);
        }

        .header-links a::after {
            content: '';
            position: absolute;
            bottom: 1px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.4s var(--ease-spring);
        }

        .header-links a:hover { color: var(--accent); }
        .header-links a:hover::after { width: 100%; }

        /* ——— Loading ——— */
        #loading {
            text-align: left;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 1rem 0;
            flex-shrink: 0;
        }

        .loading-shimmer {
            display: block;
            height: 1px;
            width: 50px;
            margin-top: 0.5rem;
            background: linear-gradient(90deg, transparent, var(--text-tertiary), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ——— Feed: scrollable area ——— */
        #feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }

        #feed::-webkit-scrollbar {
            display: none;
        }

        /* ——— Posts ——— */
        .post-entry {
            margin-bottom: 0;
            padding: 1.2rem 0;
            border-bottom: 1px solid var(--border);
            scroll-margin-top: 8px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo);
        }

        .post-entry:first-child {
            border-top: 1px solid var(--border);
        }

        .post-entry.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .post-head {
            cursor: pointer;
            display: block;
            user-select: none;
            position: relative;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.25rem;
        }

        .meta-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-tertiary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .meta-category {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            background-color: var(--accent-muted);
            padding: 1px 6px;
            border-radius: 3px;
            font-weight: 500;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-title {
            font-family: 'Newsreader', serif;
            font-size: 1.3rem;
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            transition: color 0.3s var(--ease-out-expo);
        }

        .post-head:hover .post-title {
            color: var(--text-secondary);
        }

        .copy-btn {
            opacity: 0;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-tertiary);
            padding: 3px;
            display: flex;
            align-items: center;
            transition: opacity 0.3s var(--ease-out-expo), color 0.3s var(--ease-out-expo), transform 0.2s var(--ease-spring);
            flex-shrink: 0;
        }

        .post-head:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: var(--accent); }
        .copy-btn:active { transform: scale(0.92); }

        /* ——— Post Body ——— */
        .post-body {
            display: none;
            margin-top: 1.2rem;
            animation: contentReveal 0.4s var(--ease-out-expo);
        }

        .post-entry.open .post-body { display: block; }
        .post-entry.open .post-title { color: var(--accent); }

        .post-body p {
            margin-bottom: 1.2rem;
            text-align: left;
            line-height: 1.7;
            max-width: 65ch;
            color: var(--text-primary);
        }

        .post-body a {
            color: var(--accent);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
            text-decoration-color: rgba(139, 34, 34, 0.3);
            transition: text-decoration-color 0.3s var(--ease-out-expo), background-color 0.3s var(--ease-out-expo);
        }

        .post-body a:hover {
            text-decoration-color: var(--accent);
            background-color: var(--accent-muted);
        }

        .post-body :not(pre) > code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82em;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 2px 5px;
            border-radius: 3px;
            color: var(--text-primary);
        }

        .post-body pre {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 5px;
            overflow-x: auto;
            margin-bottom: 1.2rem;
        }

        .post-body pre code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            background-color: transparent;
            border: none;
            padding: 0;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            opacity: 0.92;
        }

        .post-body h1, .post-body h2, .post-body h3, .post-body h4 {
            font-family: 'Newsreader', serif;
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-top: 1.5rem;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
        }

        .post-body h2 { font-size: 1.25rem; }
        .post-body h3 { font-size: 1.1rem; }

        .post-body ul, .post-body ol {
            margin-bottom: 1.2rem;
            padding-left: 1.4rem;
        }

        .post-body li {
            margin-bottom: 0.3rem;
            line-height: 1.65;
        }

        .post-body blockquote {
            border-left: 2px solid var(--border-strong);
            padding-left: 1rem;
            margin-bottom: 1.2rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        .post-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        /* ——— Pagination: pinned bottom ——— */
        #pagination {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            user-select: none;
            border-top: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        .nav-arrow {
            background: none;
            border: none;
            font-family: 'Outfit', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-primary);
            padding: 6px 0;
            transition: color 0.3s var(--ease-out-expo), transform 0.2s var(--ease-spring);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-arrow:hover { color: var(--accent); }
        .nav-arrow:active { transform: scale(0.97); }

        .nav-arrow.disabled {
            color: var(--border-strong);
            cursor: default;
            pointer-events: none;
        }

        .nav-arrow .arrow-icon {
            font-family: 'Newsreader', serif;
            font-size: 1.2rem;
            line-height: 1;
            transition: transform 0.3s var(--ease-spring);
        }

        .nav-arrow:hover .arrow-icon-left { transform: translateX(-3px); }
        .nav-arrow:hover .arrow-icon-right { transform: translateX(3px); }

        /* ——— Responsive ——— */
        @media (max-width: 600px) {
            html, body {
                overflow: auto;
            }

            body {
                font-size: 14px;
                padding: 0 16px;
            }

            #main-container {
                height: auto;
                padding-top: 28px;
                padding-bottom: 24px;
            }

            header.profile {
                flex-direction: column;
                gap: 4px;
                align-items: flex-start;
            }

            header.profile h1 { font-size: 1.7rem; }

            .header-links { margin-left: 0; }

            .post-title { font-size: 1.15rem; }

            .copy-btn { opacity: 1; }

            .post-body pre { padding: 12px; font-size: 11px; }

            #feed {
                overflow: visible;
            }
        }

        /* ——— Animations ——— */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Focus styles */
        .post-head:focus-visible,
        .copy-btn:focus-visible,
        .nav-arrow:focus-visible,
        .header-links a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
            border-radius: 2px;
        }

        .skip-link {
            position: absolute;
            top: -100%;
            left: 16px;
            background: var(--text-primary);
            color: var(--bg);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.8rem;
            z-index: 100;
            text-decoration: none;
            transition: top 0.2s;
        }

        .skip-link:focus { top: 16px; }
    </style>
</head>
<body>

    <a href="#feed" class="skip-link">Skip to content</a>

    <div id="main-container">
        <header class="profile">
            <h1>Ian Kim</h1>
            <p class="subtitle">infra/security @ Exa, cs/math @ UT</p>
            <nav class="header-links">
                <a href="reading-list.html">Reading list</a>
                <a href="song.html">Songs I like</a>
            </nav>
        </header>

        <div id="loading" style="text-align:left;">
            Loading
            <span class="loading-shimmer"></span>
        </div>

        <section id="feed"></section>

        <nav id="pagination">
            <button id="prev-btn" class="nav-arrow" aria-label="Previous Page">
                <span class="arrow-icon arrow-icon-left">&larr;</span>
                <span>Prev</span>
            </button>
            <button id="next-btn" class="nav-arrow" aria-label="Next Page">
                <span>Next</span>
                <span class="arrow-icon arrow-icon-right">&rarr;</span>
            </button>
        </nav>
    </div>

    <script>
        const USERNAME = 'iankmm';
        const REPO = 'blogentry';

        let POSTS_PER_PAGE = 4;
        let allPosts = [];
        let currentPage = 1;

        function calcPostsPerPage() {
            const feed = document.getElementById('feed');
            const feedHeight = feed.clientHeight;
            if (!feedHeight) return;

            /* Render a hidden probe to measure one collapsed post */
            const probe = document.createElement('article');
            probe.className = 'post-entry visible';
            probe.style.cssText = 'visibility:hidden;position:absolute;width:100%;';
            probe.innerHTML = `
                <div class="post-head">
                    <div class="meta-row"><span class="meta-date">January 1, 2025</span></div>
                    <div class="title-row"><h2 class="post-title">Measure</h2></div>
                </div>
                <div class="post-body"></div>
            `;
            feed.appendChild(probe);
            const postHeight = probe.offsetHeight;
            feed.removeChild(probe);

            if (postHeight > 0) {
                POSTS_PER_PAGE = Math.max(2, Math.floor(feedHeight / postHeight));
            }
        }

        marked.use({
            gfm: true,
            breaks: true
        });

        /* Scroll-driven stagger reveal */
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    const el = entry.target;
                    const delay = parseInt(el.dataset.index || 0) * 70;
                    setTimeout(() => el.classList.add('visible'), delay);
                    revealObserver.unobserve(el);
                }
            });
        }, { threshold: 0.05 });

        async function initBlog() {
            const feed = document.getElementById('feed');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
                if (!response.ok) throw new Error('Failed to load repo contents');
                const files = await response.json();

                const mdFiles = files.filter(file =>
                    file.name.endsWith('.md') &&
                    file.name.toLowerCase() !== 'readme.md' &&
                    file.name.toLowerCase() !== 'books.md'
                );

                const postsData = await Promise.all(mdFiles.map(async (file) => {
                    const contentRes = await fetch(file.download_url);
                    const text = await contentRes.text();
                    return parsePost(text);
                }));

                postsData.sort((a, b) => {
                    const dateA = !isNaN(a.dateObj) ? a.dateObj : 0;
                    const dateB = !isNaN(b.dateObj) ? b.dateObj : 0;
                    return dateB - dateA;
                });

                allPosts = postsData;

                loading.style.display = 'none';

                calcPostsPerPage();

                const hash = window.location.hash.substring(1);
                if (hash) {
                    const postIndex = allPosts.findIndex(p => p.slug === hash);
                    if (postIndex !== -1) {
                        currentPage = Math.ceil((postIndex + 1) / POSTS_PER_PAGE);
                    }
                }

                renderPage(currentPage);

            } catch (error) {
                console.error(error);
                loading.innerHTML = '<span style="color: var(--accent);">Connection failed. Please try again.</span>';
            }
        }

        /* Recalculate on resize */
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const prevCount = POSTS_PER_PAGE;
                calcPostsPerPage();
                if (prevCount !== POSTS_PER_PAGE && allPosts.length > 0) {
                    currentPage = 1;
                    renderPage(currentPage);
                }
            }, 200);
        });

        function renderPage(page) {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            feed.scrollTop = 0;

            const start = (page - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const postsToRender = allPosts.slice(start, end);

            postsToRender.forEach((post, i) => renderPost(post, feed, i));

            updatePaginationControls();
            handleDeepLink();
        }

        function updatePaginationControls() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);

            if (currentPage <= 1) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            if (currentPage >= totalPages || totalPages === 0) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            const totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

        function protectLatex(text) {
            const placeholders = [];
            text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match) => {
                placeholders.push(match);
                return `%%LATEX_${placeholders.length - 1}%%`;
            });
            text = text.replace(/\$([^\$]+?)\$/g, (match) => {
                placeholders.push(match);
                return `%%LATEX_${placeholders.length - 1}%%`;
            });
            return { text, placeholders };
        }

        function restoreLatex(html, placeholders) {
            return html.replace(/%%LATEX_(\d+)%%/g, (_, index) => placeholders[parseInt(index)]);
        }

        function parsePost(rawText) {
            const lines = rawText.split('\n');
            let title = 'Untitled';
            let dateStr = '';
            let category = '';
            let contentStartIndex = 0;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('Date:')) dateStr = line.replace('Date:', '').trim();
                else if (line.startsWith('Title:')) title = line.replace('Title:', '').trim();
                else if (line.startsWith('Category:')) category = line.replace('Category:', '').trim();
                else if (line === '---') {
                    contentStartIndex = i + 1;
                    break;
                }
            }

            const dateObj = new Date(dateStr);
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            const rawBody = lines.slice(contentStartIndex).join('\n');

            const { text: protectedBody, placeholders } = protectLatex(rawBody);
            const bodyHtml = restoreLatex(marked.parse(protectedBody), placeholders);

            return { title, slug, dateStr, dateObj, category, bodyHtml };
        }

        function renderMath(element) {
            if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                MathJax.typesetPromise([element]).catch((err) => console.log('MathJax parsing error: ', err));
            }
        }

        function renderPost(post, container, index) {
            const article = document.createElement('article');
            article.className = 'post-entry';
            article.id = post.slug;
            article.dataset.index = index;

            const categoryHtml = post.category
                ? `<span class="meta-category">${post.category}</span>`
                : '';

            article.innerHTML = `
                <div class="post-head" tabindex="0" role="button" aria-expanded="false">
                    <div class="meta-row">
                        <span class="meta-date">${formatDate(post.dateObj, post.dateStr)}</span>
                        ${categoryHtml}
                    </div>
                    <div class="title-row">
                        <h2 class="post-title">${post.title}</h2>
                        <button class="copy-btn" aria-label="Copy link">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="post-body">
                    ${post.bodyHtml}
                </div>
            `;

            const postHead = article.querySelector('.post-head');
            const copyBtn = article.querySelector('.copy-btn');
            const postBody = article.querySelector('.post-body');
            const feed = document.getElementById('feed');

            function togglePost() {
                const isOpen = article.classList.contains('open');
                article.classList.toggle('open');
                postHead.setAttribute('aria-expanded', !isOpen);
                if (!isOpen) {
                    setTimeout(() => {
                        article.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                    renderMath(postBody);
                }
            }

            postHead.addEventListener('click', (e) => {
                if (e.target.closest('.copy-btn')) return;
                togglePost();
            });

            postHead.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (e.target.closest('.copy-btn')) return;
                    togglePost();
                }
            });

            copyBtn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const url = `${window.location.origin}${window.location.pathname}#${post.slug}`;
                try {
                    await navigator.clipboard.writeText(url);
                    const originalColor = copyBtn.style.color;
                    copyBtn.style.color = 'var(--accent)';
                    setTimeout(() => { copyBtn.style.color = originalColor; }, 600);

                    if (!article.classList.contains('open')) {
                        article.classList.add('open');
                        postHead.setAttribute('aria-expanded', 'true');
                        article.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        renderMath(postBody);
                    }
                    history.pushState(null, null, `#${post.slug}`);
                } catch (err) { console.error('Failed to copy', err); }
            });

            container.appendChild(article);
            revealObserver.observe(article);
            renderMath(article);
        }

        function handleDeepLink() {
            const hash = window.location.hash.substring(1);
            if (!hash) return;
            const targetPost = document.getElementById(hash);
            if (targetPost) {
                targetPost.classList.add('open', 'visible');
                const postHead = targetPost.querySelector('.post-head');
                if (postHead) postHead.setAttribute('aria-expanded', 'true');
                renderMath(targetPost.querySelector('.post-body'));
                setTimeout(() => targetPost.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
            }
        }

        function formatDate(dateObj, originalStr) {
            if (isNaN(dateObj)) return originalStr;
            return dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        initBlog();
    </script>
</body>
</html>
